name: tanaghom-dashboard-demo

x-logging: &bounded-logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: tanaghom_demo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d tanaghom_demo"]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 150
    security_opt: [no-new-privileges:true]
    logging: *bounded-logging

  migrate:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: tanaghom_demo
    secrets: [postgres_password, api_password, workspace_password]
    volumes:
      - ../../packages/database/migrations:/migrations:ro
      - ../../packages/database/seeds:/seeds:ro
      - ./sql:/demo-sql:ro
      - ./scripts/apply-migrations.sh:/apply.sh:ro
    entrypoint: ["/bin/sh", "/apply.sh"]
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 100
    logging: *bounded-logging

  auth:
    image: node:24.18.0-alpine3.24@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    user: node
    environment:
      DEMO_AUTH_PORT: "43191"
      DEMO_AUTH_ISSUER: http://auth:43191/auth/v1
    secrets: [auth_users, auth_private_key]
    volumes:
      - ./auth/server.mjs:/app/server.mjs:ro
      - ./scripts/smoke.mjs:/app/demo-smoke.mjs:ro
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 80
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:43191/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 5s
    logging: *bounded-logging

  storage:
    image: rustfs/rustfs:latest@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint-demo.sh"]
    command: ["rustfs"]
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: /tmp/logs
    secrets: [s3_access_key, s3_secret_key]
    volumes:
      - rustfsdata:/data
      - ./storage/entrypoint-demo.sh:/entrypoint-demo.sh:ro
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 120
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 10s
    logging: *bounded-logging

  storage-init:
    image: node:24.18.0-alpine3.24@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd
    restart: "no"
    depends_on:
      storage: { condition: service_healthy }
    command: ["node", "/scripts/init-bucket.mjs"]
    environment:
      DEMO_S3_ENDPOINT: http://storage:9000
      DEMO_S3_REGION: us-east-1
      DEMO_S3_BUCKET: tanaghom-demo
    secrets: [s3_access_key, s3_secret_key]
    volumes:
      - ./scripts/init-bucket.mjs:/scripts/init-bucket.mjs:ro
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 80
    logging: *bounded-logging

  dashboard:
    image: tanaghom-dashboard-demo:${TANAGHOM_DEMO_RELEASE:-local}
    build:
      context: ../..
      dockerfile: deployment/dashboard-demo/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      auth: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    environment:
      APP_ENV: demo
      APP_BASE_URL: ${TANAGHOM_DEMO_BASE_URL:-http://127.0.0.1:3210}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      AGENT_RUNTIME_PROVIDER_EXECUTION_ENABLED: "false"
      AGENCY_PILOT_GATEWAY_ENABLED: "false"
      AGENCY_WORKSPACE_ENABLED: ${AGENCY_WORKSPACE_ENABLED:-false}
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      POSTIZ_HANDOFF_ENABLED: "false"
      POSTIZ_AUTOMATION_RUNTIME_READY: "false"
      POSTIZ_PERFORMANCE_SYNC_ENABLED: "false"
      GHL_CONTACT_SYNC_ENABLED: "false"
      GHL_CONTACT_HANDOFF_ENABLED: "false"
      GHL_WEBHOOK_INGRESS_ENABLED: "false"
      GHL_ACTION_RUNTIME_ENABLED: "false"
      GHL_ACTION_RUNTIME_READY: "false"
      ALLOW_STAGING_PUBLISH: "false"
      CREATIVE_STUDIO_ENABLED: "true"
      DESIGN_STUDIO_ENABLED: "true"
      CAROUSEL_BUILDER_ENABLED: "true"
      MOTION_STUDIO_ENABLED: "true"
      GENERATIVE_VIDEO_ENABLED: "false"
      ML_SEGMENTATION_ENABLED: "false"
      IMAGE_GENERATION_ENABLED: "false"
      TALKING_HEAD_ENABLED: "false"
      LIP_SYNC_ENABLED: "false"
      CUSTOM_AVATAR_ENABLED: "false"
      CREATIVE_STORAGE_BACKEND: s3
      CREATIVE_STORAGE_S3_ENDPOINT: http://storage:9000
      CREATIVE_STORAGE_S3_REGION: us-east-1
      CREATIVE_STORAGE_S3_BUCKET: tanaghom-demo
      CREATIVE_STORAGE_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key
      CREATIVE_STORAGE_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      CREATIVE_STORAGE_S3_CONDITIONAL_WRITES: verified
    secrets:
      - database_url
      - supabase_url
      - supabase_publishable_key
      - supabase_jwks_url
      - s3_access_key
      - s3_secret_key
      - workspace_database_url
      - workspace_worker_token
      - gemini_api_key
    ports:
      - "127.0.0.1:3210:3000"
    networks: [backend, edge]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 256m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    logging: *bounded-logging

  workspace-worker:
    image: node:24.18.0-alpine3.24@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd
    profiles: [workspace]
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      dashboard: { condition: service_healthy }
    command: ["node", "/app/worker.mjs"]
    user: node
    environment:
      DEMO_INTERNAL_BASE_URL: http://dashboard:3000
      WORKSPACE_WORKER_TOKEN_FILE: /run/secrets/workspace_worker_token
      WORKSPACE_WORKER_POLL_MS: "5000"
    secrets: [workspace_worker_token]
    volumes:
      - ./worker.mjs:/app/worker.mjs:ro
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 80
    logging: *bounded-logging

networks:
  backend:
    name: tanaghom-dashboard-demo-backend
    driver: bridge
    internal: true
  edge:
    name: tanaghom-dashboard-demo-edge
    driver: bridge

volumes:
  pgdata:
    name: tanaghom-dashboard-demo-pgdata
  rustfsdata:
    name: tanaghom-dashboard-demo-rustfsdata

secrets:
  postgres_password:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/postgres_password
  api_password:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/api_password
  database_url:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/database_url
  supabase_url:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/supabase_url
  supabase_publishable_key:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/supabase_publishable_key
  supabase_jwks_url:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/supabase_jwks_url
  auth_users:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/auth_users.json
  auth_private_key:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/auth_private_key.pem
  s3_access_key:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/s3_access_key
  s3_secret_key:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/s3_secret_key
  workspace_password:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/workspace_password
  workspace_database_url:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/workspace_database_url
  workspace_worker_token:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/workspace_worker_token
  gemini_api_key:
    file: ${TANAGHOM_DEMO_SECRETS_DIR:?set TANAGHOM_DEMO_SECRETS_DIR}/gemini_api_key
